[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-vega"
version = "0.1.0"
description = "Qanba Titan input discovery tools for Project Vega"
requires-python = ">=3.13,<3.14"
dependencies = ["pygame==2.6.1"]

[project.scripts]
vega-inspect-titan = "vega.diagnostics.inspect_titan:main"
vega-inspect-gestures = "vega.diagnostics.inspect_gestures:main"

[tool.setuptools.packages.find]
where = ["src"]
